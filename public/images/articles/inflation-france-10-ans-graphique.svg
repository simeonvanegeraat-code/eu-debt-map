  <title id="title">Inflation en France et dans la zone euro d’août 2016 à août 2026</title>
  <desc id="desc">Courbe de l’inflation annuelle selon la méthode européenne. La France atteint 7,3 pour cent en février 2023 et termine à 2,6 pour cent en août 2026. La zone euro termine à 3,2 pour cent.</desc>
